name = "daledreams-record-book"
main = "src/index.ts"
compatibility_date = "2026-10-28"

[vars]
ACCESS_TEAM_DOMAIN = "your-team.cloudflareaccess.com"
ACCESS_AUD = "SET_FROM_CLOUDFLARE_ACCESS"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "daledreams-record-book"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"
